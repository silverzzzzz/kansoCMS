packages:
  - apps/*
  - packages/*
  - examples/*

# Supply-chain policy. pnpm 12 already defaults to minimumReleaseAge 1440 and blockExoticSubdeps
# true. Setting them keeps them if a default changes, and an explicit minimumReleaseAge is strict:
# the install fails instead of falling back to a version that is too new.
# Refuse versions published less than a day (1440 minutes) ago.
minimumReleaseAge: 1440
# Refuse a version published with weaker evidence (trusted publishing, provenance) than before.
trustPolicy: no-downgrade
# Reviewed downgrades that no version satisfying the dependent's range avoids.
trustPolicyExclude:
  # Last 4.x, published by its maintainer without provenance; @astrojs/check needs ^4.0.3.
  - chokidar@4.0.3
  # Types only, published without provenance; every @types/node@22 pins ~6.21.0.
  - undici-types@6.21.0
# Only direct dependencies may come from git or tarball URLs; subdependencies use the registry.
blockExoticSubdeps: true

# Replaces vulnerable versions that the dependents' own ranges keep.
overrides:
  # drizzle-kit declares @esbuild-kit/esm-loader but never loads it. Its core-utils pins esbuild
  # ~0.18.20 (GHSA-67mh-4wv8-2f99, fixed in 0.25.0); use the esbuild drizzle-kit itself requires.
  '@esbuild-kit/core-utils>esbuild': ^0.25.4

# Dependencies that may run their install scripts. pnpm stops the install when
# a dependency with such a script is not listed here.
allowBuilds:
  esbuild: true
  workerd: true
  # Reaches the workspace through the Astro example, which never optimises images.
  sharp: false
